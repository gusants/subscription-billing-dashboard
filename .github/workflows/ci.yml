name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests with coverage
        run: pnpm test:cov

      - name: Build
        run: pnpm build

  contract:
    name: Contract drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check out the payments API contract
        uses: actions/checkout@v4
        with:
          repository: gusants/subscription-payments-api
          ref: main
          path: payments-api
          sparse-checkout: openapi.json
          sparse-checkout-cone-mode: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Fails when the payments API main branch changed its contract and
      # src/api/generated/schema.d.ts was not regenerated (pnpm generate:api-types).
      - name: Regenerate types from the API main branch
        run: pnpm generate:api-types
        env:
          OPENAPI_SOURCE: payments-api/openapi.json

      - name: Fail on drift
        run: git diff --exit-code -- src/api/generated
