<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadência Billing</title>
    <meta
      name="description"
      content="Billing dashboard for a subscription SaaS, built on a NestJS payments API. Runs in the browser, no sign-up."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://gusants.github.io/subscription-billing-dashboard/"
    />
    <meta
      property="og:title"
      content="Subscription Billing Dashboard — Live Demo (React 19)"
    />

      property="og:description"
      content="Billing dashboard for a subscription SaaS, built on a NestJS payments API. Runs in the browser, no sign-up."

    <meta
      property="og:image"

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="627" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      try {
        const theme = JSON.parse(
          localStorage.getItem('cadencia-ui-preferences') ?? '{}',
        )?.state?.theme
        if (theme === 'light' || theme === 'dark')
          document.documentElement.dataset.theme = theme
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
